# DRAFT contract. Both owners approve at Gate 1; FastAPI /openapi.json is the source of truth.
openapi: 3.0.3
info: {title: Fraud Platform Scoring API, version: 0.1.0}
paths:
  /v1/transactions/score:
    post:
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [txn_id, user_id, amount, ts]
              properties:
                txn_id: {type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:|-]+$", description: "letters, digits and . _ : | - only (ST6)"}
                user_id: {type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:|-]+$", description: "the card's proxy id; stored only as a pseudonym (docs/privacy.md)"}
                amount: {type: number, minimum: 0, exclusiveMinimum: true}   # OpenAPI 3.0 form of > 0 (found by ST5)
                ts: {type: string, format: date-time, description: "with a time zone offset between -12:00 and +14:00, in the years 1970-2099 (UTC); stored in UTC (features/schema.yaml, payment_time)"}
                channel: {type: string, nullable: true, maxLength: 256}
                attrs:
                  type: object
                  additionalProperties: false
                  description: "the 51 raw IEEE-CIS columns of features/schema.yaml, typed as it says (features/contract.py); any may be left out or null; any other key is refused"
                  properties:
                    card1: {type: number, nullable: true}
                    card2: {type: number, nullable: true}
                    card3: {type: number, nullable: true}
                    card4: {type: string, nullable: true, maxLength: 256}
                    card5: {type: number, nullable: true}
                    card6: {type: string, nullable: true, maxLength: 256}
                    addr1: {type: number, nullable: true}
                    addr2: {type: number, nullable: true}
                    dist1: {type: number, nullable: true}
                    ProductCD: {type: string, nullable: true, maxLength: 256}
                    P_emaildomain: {type: string, nullable: true, maxLength: 256}
                    R_emaildomain: {type: string, nullable: true, maxLength: 256}
                    DeviceType: {type: string, nullable: true, maxLength: 256}
                    C1: {type: number, nullable: true}
                    C2: {type: number, nullable: true}
                    C3: {type: number, nullable: true}
                    C4: {type: number, nullable: true}
                    C5: {type: number, nullable: true}
                    C6: {type: number, nullable: true}
                    C7: {type: number, nullable: true}
                    C8: {type: number, nullable: true}
                    C9: {type: number, nullable: true}
                    C10: {type: number, nullable: true}
                    C11: {type: number, nullable: true}
                    C12: {type: number, nullable: true}
                    C13: {type: number, nullable: true}
                    C14: {type: number, nullable: true}
                    D1: {type: number, nullable: true}
                    D2: {type: number, nullable: true}
                    D3: {type: number, nullable: true}
                    D4: {type: number, nullable: true}
                    D5: {type: number, nullable: true}
                    D6: {type: number, nullable: true}
                    D7: {type: number, nullable: true}
                    D8: {type: number, nullable: true}
                    D9: {type: number, nullable: true}
                    D10: {type: number, nullable: true}
                    D11: {type: number, nullable: true}
                    D12: {type: number, nullable: true}
                    D13: {type: number, nullable: true}
                    D14: {type: number, nullable: true}
                    D15: {type: number, nullable: true}
                    M1: {type: string, nullable: true, maxLength: 256}
                    M2: {type: string, nullable: true, maxLength: 256}
                    M3: {type: string, nullable: true, maxLength: 256}
                    M4: {type: string, nullable: true, maxLength: 256}
                    M5: {type: string, nullable: true, maxLength: 256}
                    M6: {type: string, nullable: true, maxLength: 256}
                    M7: {type: string, nullable: true, maxLength: 256}
                    M8: {type: string, nullable: true, maxLength: 256}
                    M9: {type: string, nullable: true, maxLength: 256}
      responses:
        "200":
          description: >-
            The decision. Clients (role client) get only txn_id and decision (E6 defense D1:
            the score and reasons would help someone probing the API). The test-only role
            tester (load-test) gets every field below; analysts see them in cases.
          content:
            application/json:
              schema:
                type: object
                required: [txn_id, decision]
                properties:
                  txn_id: {type: string}
                  decision: {type: string, enum: [approve, review, decline]}
                  score: {type: number, description: "tester only, like every field below"}
                  model_version: {type: string, description: "model name plus the first 8 characters of its model.txt SHA-256, e.g. fraud-lgbm-v1-535eb73c; changes whenever the model's files change"}
                  reasons: {type: array, items: {type: string}, description: "up to 3 features that raised the risk, e.g. C1=72 (+2.32), after probe detection's reason when it held the payment; empty when approved"}
                  cold_start: {type: boolean, description: "true when the user has no trusted history (unknown id or first payment)"}
                  degraded: {type: boolean, description: "true when scored without history because the history store did not answer in time"}
                  probe: {type: boolean, description: "true when probe detection (E6 defense D3) turned an approval into a review: 5 or more payments the model flagged on this card in the 24 h before"}
        "401": {description: "missing or invalid token, or one issued more than 5 minutes ago (replays, threat 6): get a new one"}
        "403": {description: role not allowed}
        "413": {description: body over 16 KB}
        "422": {description: body does not match this contract; a copy is kept in dlq.txn}
        "429": {description: over the client's rate limit}
        "503": {description: could not record the transaction; retry with the same txn_id}
  # The bank's case-management system (week 4, step 7; docs/siem.md)
  /v1/cases/txn/{txn_id}:
    get:
      summary: A case's status, found by the payment's transaction id
      description: Roles case-system and analyst. Leaves out the customer id and the amount.
      security: [{bearerAuth: []}]
      parameters:
        - {name: txn_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:|-]+$"}}
      responses:
        "200":
          description: the case
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CaseStatus"}
        "401": {description: missing or invalid token}
        "403": {description: role not allowed}
        "404": {description: no case for this transaction (approved payments have none)}
        "422": {description: not a transaction id}
        "429": {description: over the rate limit}
  /v1/cases/txn/{txn_id}/decision:
    post:
      summary: Write back the case system's decision
      description: Role case-system only. Resolves the case with an audit row; never overwrites one.
      security: [{bearerAuth: []}]
      parameters:
        - {name: txn_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:|-]+$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: {type: string, enum: [fraud, not_fraud]}
                note: {type: string, maxLength: 500, description: "any text but a NUL character"}
                external_ref: {type: string, maxLength: 128, description: "the case system's own ticket number; kept in the audit row; no NUL character"}
      responses:
        "200":
          description: the resolved case
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CaseStatus"}
        "401": {description: missing or invalid token}
        "403": {description: role not allowed}
        "404": {description: no case for this transaction}
        "409": {description: the case is already resolved}
        "422": {description: body does not match this contract}
components:
  schemas:
    CaseStatus:
      type: object
      properties:
        case_id: {type: integer}
        txn_id: {type: string}
        status: {type: string, enum: [open, fraud, not_fraud]}
        decision: {type: string, enum: [review, decline]}
        score: {type: number}
        reasons: {type: array, items: {type: string}}
        model_version: {type: string}
        degraded: {type: boolean}
        opened_at: {type: string, format: date-time}
        resolved_by: {type: string, nullable: true}
        resolved_at: {type: string, format: date-time, nullable: true}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
