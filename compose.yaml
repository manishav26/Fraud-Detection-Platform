# Local dev stack (Gate 1). Cassandra heap is capped to keep laptops alive.
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command: >
      redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M
      --node-id 0 --check=false
      --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
    ports: ["9092:9092"]  # laptop uses localhost:9092; containers use redpanda:29092
    # Promotions live in model.events: without this, `make down` forgets which model is live
    volumes: ["redpanda-data:/var/lib/redpanda/data"]
  cassandra:
    image: cassandra:4.1
    # Logins and permissions on, the same as on Kubernetes (docs/cassandra.md)
    entrypoint: ["sh", "-c"]
    command:
      - >-
        sed -i -e 's/^authenticator:.*/authenticator: PasswordAuthenticator/'
        -e 's/^authorizer:.*/authorizer: CassandraAuthorizer/' /etc/cassandra/cassandra.yaml
        && exec docker-entrypoint.sh cassandra -f
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    ports: ["9042:9042"]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud_dev_only
      POSTGRES_DB: fraud
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data   # the registry must survive `make down`
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during first-time setup Postgres listens only on its local socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fraud -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 20
  objectstore:  # S3-compatible store (RustFS); MinIO no longer ships free images or binaries
    image: rustfs/rustfs:1.0.3   # the release `latest` pointed to on 10 Nov (same digest)
    environment:
      RUSTFS_ACCESS_KEY: minio_dev
      RUSTFS_SECRET_KEY: minio_dev_only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["objectstore-data:/data"]
  mlflow:  # model registry. Design: docs/mlflow.md
    build: ./services/mlflow
    image: fraud/mlflow:dev
    environment:
      # Driver named on purpose: plain postgresql:// makes SQLAlchemy look for psycopg, not psycopg2
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:mlflow_dev_only@postgres:5432/mlflow
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow
      MLFLOW_S3_ENDPOINT_URL: http://objectstore:9000
      AWS_ACCESS_KEY_ID: minio_dev
      AWS_SECRET_ACCESS_KEY: minio_dev_only
      AWS_DEFAULT_REGION: us-east-1
      # Background workers for GenAI features we don't use: about 175 MB each, over the 1 GB limit
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      # MLflow rejects host names it doesn't know; these are how we reach it
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow,mlflow:*,localhost,localhost:*,127.0.0.1:*"
    # Laptop only, because this MLflow has no login. 5050, because macOS AirPlay uses 5000.
    ports: ["127.0.0.1:5050:5000"]
    depends_on:
      postgres: {condition: service_healthy}
      objectstore: {condition: service_started}
    mem_limit: 1g
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  token-issuer:
    build: { context: ., dockerfile: services/token-issuer/Dockerfile }
    image: fraud/token-issuer:dev   # same name in deploy/k8s
    # Two files only: its signing key and the clients' hashed secrets, not the plain secrets
    volumes:
      - ./keys/private.pem:/keys/private.pem:ro
      - ./keys/clients.issuer.json:/clients/clients.issuer.json:ro
    environment: { PRIVATE_KEY_PATH: /keys/private.pem, CLIENTS_PATH: /clients/clients.issuer.json }
  scoring-svc:
    build: { context: ., dockerfile: services/scoring-svc/Dockerfile }
    image: fraud/scoring-svc:dev
    env_file: deploy/scoring.env
    environment:   # its own Cassandra login: read and write txn_by_user, nothing else
      CASSANDRA_USER: scoring
      CASSANDRA_PASSWORD: scoring_dev_only
    volumes:
      - ./models:/models:ro   # read-only: the service can't change its own model
      - ./promotion-keys/public.pem:/promotion/public.pem:ro   # only the public key, one file
    depends_on: [cassandra, redpanda, mlflow]
    restart: on-failure   # e.g. Cassandra still starting: exit, Docker starts us again
  ingest-svc:
    build: { context: ., dockerfile: services/ingest-svc/Dockerfile }
    image: fraud/ingest-svc:dev
    networks:
      default:
        aliases: [ingest-pods]   # the name Kong uses, the same as on Kubernetes
    environment: { SCORING_URL: "http://scoring-svc:8000", KAFKA_BOOTSTRAP: "redpanda:29092" }
    depends_on: [scoring-svc, redpanda]
  alert-svc:  # opens cases from txn.scored. Design: docs/alerts.md
    build: { context: ., dockerfile: services/alert-svc/Dockerfile }
    image: fraud/alert-svc:dev
    environment:
      KAFKA_BOOTSTRAP: "redpanda:29092"
      # Its own login: may add cases and audit rows, never change the audit log
      ALERTS_DSN: "postgresql://alerts:alerts_dev_only@postgres:5432/fraud"
      SIEM_URL: "http://siem-mock:8000"   # every audit row goes to the SIEM (docs/siem.md)
      SIEM_TOKEN: siem_dev_only
    depends_on: [redpanda, postgres, siem-mock]
  feature-job:  # streaming features (docs/spark.md). Not started by `make up` (memory):
    # docker compose --profile spark up -d feature-job
    profiles: [spark]
    build: { context: ., dockerfile: services/feature-job/Dockerfile }
    image: fraud/feature-job:dev
    environment:
      KAFKA_BOOTSTRAP: "redpanda:29092"
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_USER: features
      CASSANDRA_PASSWORD: features_dev_only
      CHECKPOINT: /tmp/checkpoint/feature-job   # lost with the container: compose is for trying it
    depends_on: [redpanda, cassandra]
  siem-mock:  # stand-in for the security team's SIEM. View: http://localhost:8088
    build: { context: ., dockerfile: services/siem-mock/Dockerfile }
    image: fraud/siem-mock:dev
    environment: { SIEM_TOKEN: siem_dev_only }
    ports: ["127.0.0.1:8088:8000"]   # laptop only
  model-admin-svc:  # admin promote and rollback, each with an audit row. Design: docs/mlflow.md
    build: { context: ., dockerfile: services/model-admin-svc/Dockerfile }
    image: fraud/model-admin-svc:dev
    environment:
      KAFKA_BOOTSTRAP: "redpanda:29092"
      # Its own login: may read and add audit rows, nothing else
      MODEL_ADMIN_DSN: "postgresql://model_admin:model_admin_dev_only@postgres:5432/fraud"
      PROMOTION_PUBLIC_KEY_PATH: /promotion/public.pem
    volumes:
      - ./promotion-keys/public.pem:/promotion/public.pem:ro   # checks promotions, can't sign one
    depends_on: [redpanda, postgres]
  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_STATUS_LISTEN: 0.0.0.0:8100   # Kong's own metrics, not published to the laptop
      # Shorter than our services' 75 s keep-alive, so Kong always closes first (docs/k8s.md)
      KONG_UPSTREAM_KEEPALIVE_IDLE_TIMEOUT: "60"
    volumes: ["./deploy/kong:/kong:ro"]
    ports: ["8000:8000"]
    depends_on: [ingest-svc, token-issuer]
  # Metrics (week 3, step 7). Same versions and dashboard as the cluster. Design: docs/metrics.md
  prometheus:
    image: prom/prometheus:v3.13.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d   # enough for a test day; keeps memory down
    volumes:
      - ./deploy/prometheus/prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]   # laptop only: it has no login
    # Caps: the tool that measures the platform must not slow the platform down
    cpus: 1
    mem_limit: 768m
  grafana:
    image: grafana/grafana:11.6.7   # not 13: see deploy/k8s/base/grafana.yaml
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: grafana_dev_only
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # No calls home
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    # The same files as the cluster: one dashboard to keep up to date
    volumes:
      - ./deploy/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]   # laptop only
    depends_on: [prometheus]
    cpus: 1
    mem_limit: 384m

volumes:
  redpanda-data:
  postgres-data:
  objectstore-data:
