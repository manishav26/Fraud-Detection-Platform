# Local dev stack (Gate 1). Cassandra heap is capped to keep laptops alive.
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command: >
      redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M
      --node-id 0 --check=false
      --kafka-addr PLAINTEXT://0.0.0.0:9092
      --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports: ["9092:9092"]
  cassandra:
    image: cassandra:4.1
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    ports: ["9042:9042"]
    volumes: ["./deploy/cassandra:/schema:ro"]  # loaded by `make schema`
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud_dev_only
      POSTGRES_DB: fraud
    ports: ["5432:5432"]
  objectstore:  # S3-compatible store (RustFS); MinIO no longer ships free images or binaries
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: minio_dev
      RUSTFS_SECRET_KEY: minio_dev_only
    ports: ["9000:9000", "9001:9001"]
  token-issuer:
    build: ./services/token-issuer
    volumes: ["./keys:/keys:ro"]
    environment: { PRIVATE_KEY_PATH: /keys/private.pem }
  scoring-svc:
    build: ./services/scoring-svc
  ingest-svc:
    build: ./services/ingest-svc
    environment: { SCORING_URL: "http://scoring-svc:8000" }
    depends_on: [scoring-svc]
  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    volumes: ["./deploy/kong:/kong:ro"]
    ports: ["8000:8000"]
    depends_on: [ingest-svc, token-issuer]
