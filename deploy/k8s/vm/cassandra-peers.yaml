# Cassandra's nodes find each other by name (docs/cassandra.md, "Three nodes"): a headless
# Service gives each pod a stable DNS name, cassandra-0.cassandra-peers.fraud.svc.cluster.local.
# publishNotReadyAddresses: a node must be found while it is still joining, before it is ready.
# Clients don't use this: they keep using the `cassandra` Service on 9042.
apiVersion: v1
kind: Service
metadata:
  name: cassandra-peers
  annotations:   # not HTTP: Linkerd encrypts it without reading it (docs/mtls.md)
    config.linkerd.io/opaque-ports: "7000"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: cassandra}
  ports:
    - {name: intra-node, port: 7000}
---
# A voluntary disruption (a node drained) takes at most one Cassandra node at a time: with 3
# copies and LOCAL_QUORUM (2 of 3), one node down still answers every read and write.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cassandra
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: cassandra}
