# Cassandra on 3 nodes, one per k3d node (make cluster AGENTS=3). Design: docs/cassandra.md
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
spec:
  replicas: 3
  serviceName: cassandra-peers
  # Kubernetes' default, said out loud: one node at a time, each started only when the one before
  # is ready. Cassandra refuses to bootstrap two nodes at once.
  podManagementPolicy: OrderedReady
  template:
    spec:
      affinity:
        podAntiAffinity:
          # Required, not preferred: two copies on one machine would make "a node fails" lose two
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: cassandra}}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: cassandra
          env:
            # The first node; the others join through it. Its own name is its seed too.
            - {name: CASSANDRA_SEEDS, value: "cassandra-0.cassandra-peers.fraud.svc.cluster.local"}
          ports:
            - {name: intra-node, containerPort: 7000}
          # Ready only when Cassandra itself serves clients, which is after it has joined the ring.
          # The base's TCP check on 9042 is answered by the Linkerd proxy as soon as the proxy is
          # up, so it could pass while the node is still starting, and the next node would then
          # bootstrap at the same time.
          readinessProbe:
            $patch: replace
            exec:
              command: ["sh", "-c", "[ \"$(nodetool statusbinary)\" = running ]"]
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 3
