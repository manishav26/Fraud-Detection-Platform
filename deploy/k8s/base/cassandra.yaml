# Single Cassandra node, same heap as compose. A disk, so a restart keeps user history
# (the 3-node version for the consistency experiment comes later).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels: {app: cassandra}
  template:
    metadata:
      labels: {app: cassandra}
    spec:
      serviceAccountName: cassandra            # its own identity (docs/network.md)
      automountServiceAccountToken: false   # no Kubernetes API token: it never needs one
      containers:
        - name: cassandra
          image: cassandra:4.1
          imagePullPolicy: IfNotPresent
          # Logins and permissions on (week 4, step 3; docs/cassandra.md). The image has no setting
          # for these, so edit its config, then start it as the image normally does.
          command: ["sh", "-c"]
          args:
            - >-
              sed -i -e 's/^authenticator:.*/authenticator: PasswordAuthenticator/'
              -e 's/^authorizer:.*/authorizer: CassandraAuthorizer/' /etc/cassandra/cassandra.yaml
              && exec docker-entrypoint.sh cassandra -f
          env:
            - {name: MAX_HEAP_SIZE, value: 1G}
            - {name: HEAP_NEWSIZE, value: 256M}
          ports:
            - {name: cql, containerPort: 9042}
          volumeMounts:
            - {name: data, mountPath: /var/lib/cassandra}
          readinessProbe:
            tcpSocket: {port: 9042}
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            requests: {cpu: 500m, memory: 1500Mi}
            limits: {memory: 2Gi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra
spec:
  selector: {app: cassandra}
  ports:
    - {name: cql, port: 9042}
