# One identity per workload (week 4, step 3). Before, every pod ran as the namespace's
# `default` account with a Kubernetes API token mounted. None of these pods calls the API, so each
# pod also sets automountServiceAccountToken: false: a compromised pod gets no token to use.
# Prometheus keeps its own account (prometheus.yaml), the one pod that reads the API.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kong
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: token-issuer
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingest-svc
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scoring-svc
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-svc
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-admin-svc
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
