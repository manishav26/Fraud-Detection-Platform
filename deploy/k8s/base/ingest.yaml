# 2 copies of ingest-svc. Each has its own Redpanda producer and its own connections to scoring.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-svc
spec:
  replicas: 2
  # A new pod must be ready before an old one goes: rollouts never lower capacity
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: ingest-svc}
  template:
    metadata:
      labels: {app: ingest-svc}
      annotations:   # Prometheus reads this pod's metrics (deploy/prometheus/)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ingest-svc            # its own identity (docs/network.md)
      automountServiceAccountToken: false   # no Kubernetes API token: it never needs one
      securityContext:   # not root, and the runtime's default syscall filter (Trivy KSV-0118)
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ingest-svc
          image: fraud/ingest-svc:dev
          imagePullPolicy: Never
          env:
            - {name: SCORING_URL, value: "http://scoring-svc:8000"}
            - {name: KAFKA_BOOTSTRAP, value: "redpanda:29092"}
          envFrom:
            - secretRef: {name: kafka-ingest}   # its Redpanda user: write the payment topics only
            - secretRef: {name: pseudonym-key}  # PSEUDONYM_KEY: user ids -> pseudonyms (docs/privacy.md)
          ports:
            - {name: http, containerPort: 8000}
          # Probes (docs/k8s.md). startup: time to connect and load before the others count;
          # readiness: traffic only when it can answer; liveness: restart only if it stops
          # answering for a minute, never for one slow burst
          startupProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
            failureThreshold: 36   # up to 3 min: Redpanda may still be starting
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          # Wait before shutting down: a leaving pod drops out of the Service's ready list at once,
          # and the 15 s let Kong's proxy stop sending here and the requests already here finish
          lifecycle:
            preStop: {sleep: {seconds: 15}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}   # the only writable place (scoring downloads models here)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true   # nothing in the image can be changed (Trivy KSV-0014)
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
---
# A normal Service: Kong sends to its one name, and Kong's Linkerd proxy balances each request
# across the ready ingest pods, following Kubernetes' list of them as it changes. Only Kong calls
# ingest. Until 11 Nov this was headless (`ingest-pods`: Kong resolved and balanced the pods
# itself), which fixed connections staying tied to a leaving pod before the mesh existed; with
# the mesh it made Kong keep serving expired DNS answers, so after both ingest pods were replaced
# its first payments went to addresses that no longer existed: 502s (docs/k8s.md,
# docs/results/scaling.md, "Error cause 3").
apiVersion: v1
kind: Service
metadata:
  name: ingest-svc
spec:
  selector: {app: ingest-svc}
  ports:
    - {name: http, port: 8000}
