# 2 copies of ingest-svc. Each has its own Redpanda producer and its own connections to scoring.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-svc
spec:
  replicas: 2
  selector:
    matchLabels: {app: ingest-svc}
  template:
    metadata:
      labels: {app: ingest-svc}
      annotations:   # Prometheus reads this pod's metrics (deploy/prometheus/)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: ingest-svc
          image: fraud/ingest-svc:dev
          imagePullPolicy: Never
          env:
            - {name: SCORING_URL, value: "http://scoring-svc:8000"}
            - {name: KAFKA_BOOTSTRAP, value: "redpanda:29092"}
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            tcpSocket: {port: 8000}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-svc
spec:
  selector: {app: ingest-svc}
  ports:
    - {name: http, port: 8000}
