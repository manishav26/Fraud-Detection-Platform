apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-issuer
spec:
  replicas: 1
  # A new pod must be ready before an old one goes: rollouts never lower capacity
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: token-issuer}
  template:
    metadata:
      labels: {app: token-issuer}
      annotations:   # Prometheus reads this pod's metrics (deploy/prometheus/)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: token-issuer            # its own identity (docs/network.md)
      automountServiceAccountToken: false   # no Kubernetes API token: it never needs one
      securityContext:   # not root, and the runtime's default syscall filter (Trivy KSV-0118)
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: token-issuer
          image: fraud/token-issuer:dev
          imagePullPolicy: Never   # imported into k3d by `make k8s-up`, never pulled
          env:
            - {name: PRIVATE_KEY_PATH, value: /keys/private.pem}
            - {name: CLIENTS_PATH, value: /clients/clients.issuer.json}
          ports:
            - {name: http, containerPort: 8000}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}   # the only writable place (scoring downloads models here)
            - {name: keys, mountPath: /keys, readOnly: true}
            - {name: clients, mountPath: /clients, readOnly: true}   # hashed secrets only
          # Probes (docs/k8s.md). startup: time to connect and load before the others count;
          # readiness: traffic only when it can answer; liveness: restart only if it stops
          # answering for a minute, never for one slow burst
          startupProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
            failureThreshold: 12   # up to 1 min
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          # Kong and the Service keep sending for a moment after a pod is told to stop; wait
          # before shutting down so those requests are still answered (no 502s in a rollout)
          lifecycle:
            preStop: {sleep: {seconds: 5}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true   # nothing in the image can be changed (Trivy KSV-0014)
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: keys
          secret: {secretName: jwt-private-key, defaultMode: 0440}   # its group only (fsGroup)
        - name: clients
          secret: {secretName: issuer-clients, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: token-issuer
spec:
  selector: {app: token-issuer}
  ports:
    - {name: http, port: 8000}
