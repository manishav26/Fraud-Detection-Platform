# 2 copies of alert-svc. They read txn.scored as one consumer group, so the 6 partitions are split
# between them and each flagged payment opens one case. If one copy stops, the other takes over
# its partitions. Design: docs/alerts.md
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-svc
spec:
  replicas: 2
  # A new pod must be ready before an old one goes: rollouts never lower capacity
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: alert-svc}
  template:
    metadata:
      labels: {app: alert-svc}
      annotations:   # Prometheus reads this pod's metrics (deploy/prometheus/)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: alert-svc            # its own identity (docs/network.md)
      automountServiceAccountToken: false   # no Kubernetes API token: it never needs one
      containers:
        - name: alert-svc
          image: fraud/alert-svc:dev
          imagePullPolicy: Never
          env:
            - {name: KAFKA_BOOTSTRAP, value: "redpanda:29092"}
          envFrom:
            - secretRef: {name: alerts-credentials}   # ALERTS_DSN, with the `alerts` login
          ports:
            - {name: http, containerPort: 8000}
          # Probes (docs/k8s.md). startup: time to connect and load before the others count;
          # readiness: traffic only when it can answer; liveness: restart only if it stops
          # answering for a minute, never for one slow burst
          startupProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
            failureThreshold: 36   # up to 3 min: Redpanda and Postgres may still be starting
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          # Kong and the Service keep sending for a moment after a pod is told to stop; wait
          # before shutting down so those requests are still answered (no 502s in a rollout)
          lifecycle:
            preStop: {sleep: {seconds: 5}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-svc
spec:
  selector: {app: alert-svc}
  ports:
    - {name: http, port: 8000}
