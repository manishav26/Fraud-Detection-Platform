# Single Redpanda broker, same settings as compose. A disk, so a restart keeps the topics, and with
# them which model is live (model.events). A 3-broker cluster is the production shape (later).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels: {app: redpanda}
  template:
    metadata:
      labels: {app: redpanda}
      annotations:   # Prometheus reads this pod's metrics (deploy/prometheus/)
        prometheus.io/scrape: "true"
        prometheus.io/port: "9644"
        prometheus.io/path: "/public_metrics"
    spec:
      serviceAccountName: redpanda            # its own identity (docs/network.md)
      automountServiceAccountToken: false   # no Kubernetes API token: it never needs one
      securityContext:
        fsGroup: 101   # the image's redpanda user can write to the disk
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.2.7
          imagePullPolicy: IfNotPresent
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp=1
            - --memory=512M
            - --reserve-memory=0M
            - --node-id=0
            - --check=false
            - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
          ports:
            - {name: kafka, containerPort: 29092}
            - {name: kafka-tunnel, containerPort: 9092}   # reached only by kubectl port-forward
          volumeMounts:
            - {name: data, mountPath: /var/lib/redpanda/data}
          readinessProbe:
            tcpSocket: {port: 29092}
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 600Mi}
            limits: {memory: 1Gi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
spec:
  selector: {app: redpanda}
  ports:
    - {name: kafka, port: 29092}
