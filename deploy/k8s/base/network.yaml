# Network isolation (week 4, step 3; threat 4, test ST4). Design: docs/network.md
# GENERATED by scripts/gen_network_policies.py from security/tests/network_paths.py: edit the table
# and run the script, never this file (tests/test_k8s_manifests.py checks it is current).
#
# Default deny in both directions, then one policy per workload: who may call it (ingress) and
# whom it may call (egress). A path must be allowed at both ends, on the app's port and on
# Linkerd's proxy port 4143 (docs/mtls.md). kubectl port-forward and exec don't go through
# the pod network, so these rules don't affect the laptop tools.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}   # every pod in the namespace, including one with no labels at all
  policyTypes: [Ingress, Egress]
---
# Every pod may look up names (CoreDNS) and reach the Linkerd control plane (its certificate,
# where to send traffic, which callers to accept). Nothing else by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns-and-mesh
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: linkerd}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kong
spec:
  podSelector: {matchLabels: {app: kong}}
  policyTypes: [Ingress, Egress]
  ingress:
    # The public entrance: anyone may reach the proxy port (NodePort 30080)
    - ports: [{protocol: TCP, port: 8000}]
    - from:  # metrics
        - podSelector: {matchLabels: {app: prometheus}}
      ports: [{protocol: TCP, port: 8100}, {protocol: TCP, port: 4143}]
    - from:  # its Linkerd proxy's metrics
        - podSelector: {matchLabels: {app: prometheus}}
      ports: [{protocol: TCP, port: 4191}]
  egress:
    - to:  # payments
        - podSelector: {matchLabels: {app: ingest-svc}}
      ports: [{protocol: TCP, port: 8000}, {protocol: TCP, port: 4143}]
    - to:  # analyst case routes
        - podSelector: {matchLabels: {app: alert-svc}}
      ports: [{protocol: TCP, port: 8000}, {protocol: TCP, port: 4143}]
    - to:  # admin model routes
        - podSelector: {matchLabels: {app: model-admin-svc}}
      ports: [{protocol: TCP, port: 8000}, {protocol: TCP, port: 4143}]
    - to:  # tokens
        - podSelector: {matchLabels: {app: token-issuer}}
      ports: [{protocol: TCP, port: 8000}, {protocol: TCP, port: 4143}]
---
