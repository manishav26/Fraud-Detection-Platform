apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
spec:
  podSelector: {matchLabels: {app: prometheus}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:  # dashboard queries
        - podSelector: {matchLabels: {app: grafana}}
      ports: [{protocol: TCP, port: 9090}, {protocol: TCP, port: 4143}]
  egress:
    - to:  # metrics
        - podSelector: {matchLabels: {app: ingest-svc}}
      ports: [{protocol: TCP, port: 8000}, {protocol: TCP, port: 4143}]
    - to:  # metrics
        - podSelector: {matchLabels: {app: scoring-svc}}
      ports: [{protocol: TCP, port: 8000}, {protocol: TCP, port: 4143}]
    - to:  # metrics
        - podSelector: {matchLabels: {app: alert-svc}}
      ports: [{protocol: TCP, port: 8000}, {protocol: TCP, port: 4143}]
    - to:  # metrics
        - podSelector: {matchLabels: {app: model-admin-svc}}
      ports: [{protocol: TCP, port: 8000}, {protocol: TCP, port: 4143}]
    - to:  # metrics
        - podSelector: {matchLabels: {app: token-issuer}}
      ports: [{protocol: TCP, port: 8000}, {protocol: TCP, port: 4143}]
    - to:  # metrics
        - podSelector: {matchLabels: {app: siem-mock}}
      ports: [{protocol: TCP, port: 8000}, {protocol: TCP, port: 4143}]
    - to:  # metrics
        - podSelector: {matchLabels: {app: feature-job}}
      ports: [{protocol: TCP, port: 8000}, {protocol: TCP, port: 4143}]
    - to:  # metrics
        - podSelector: {matchLabels: {app: kong}}
      ports: [{protocol: TCP, port: 8100}, {protocol: TCP, port: 4143}]
    - to:  # metrics
        - podSelector: {matchLabels: {app: redpanda}}
      ports: [{protocol: TCP, port: 9644}, {protocol: TCP, port: 4143}]
    - to:  # every Linkerd proxy's metrics
        - podSelector: {}
      ports: [{protocol: TCP, port: 4191}]
    # The Kubernetes API, for pod discovery and CPU numbers (cAdvisor through the API)
    - to:
        - ipBlock: {cidr: 10.43.0.1/32}     # its Service address
        - ipBlock: {cidr: 172.16.0.0/12}    # the k3d nodes (Docker network)
      ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 6443}]
---
