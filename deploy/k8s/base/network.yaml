# Network isolation (week 4, step 3; threat 4, test ST4). Design: docs/network.md
# The allowed paths are listed once, in security/tests/network_paths.py. Change both together:
# tests/test_k8s_manifests.py checks this file against that table, and ST4 the running cluster.
#
# Default deny in both directions, then one policy per workload: who may call it (ingress) and
# whom it may call (egress). A path must be allowed at both ends. kubectl port-forward and exec
# (the laptop tools) don't go through the pod network, so these rules don't affect them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}   # every pod in the namespace, including one with no labels at all
  policyTypes: [Ingress, Egress]
---
# Every pod may look up names (CoreDNS in kube-system), and nothing else by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kong
spec:
  podSelector: {matchLabels: {app: kong}}
  policyTypes: [Ingress, Egress]
  ingress:
    # The public entrance: anyone may reach the proxy port (NodePort 30080)
    - ports: [{protocol: TCP, port: 8000}]
    - from:  # metrics
        - podSelector: {matchLabels: {app: prometheus}}
      ports: [{protocol: TCP, port: 8100}]
  egress:
    - to:  # payments
        - podSelector: {matchLabels: {app: ingest-svc}}
      ports: [{protocol: TCP, port: 8000}]
    - to:  # analyst case routes
        - podSelector: {matchLabels: {app: alert-svc}}
      ports: [{protocol: TCP, port: 8000}]
    - to:  # admin model routes
        - podSelector: {matchLabels: {app: model-admin-svc}}
      ports: [{protocol: TCP, port: 8000}]
    - to:  # tokens
        - podSelector: {matchLabels: {app: token-issuer}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: token-issuer
spec:
  podSelector: {matchLabels: {app: token-issuer}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:  # tokens
        - podSelector: {matchLabels: {app: kong}}
      ports: [{protocol: TCP, port: 8000}]
    - from:  # metrics
        - podSelector: {matchLabels: {app: prometheus}}
      ports: [{protocol: TCP, port: 8000}]
  egress: []   # may call nothing (DNS only, above)
---
