# Kustomize base: the whole scoring path on Kubernetes (week 2, step 6). Docs: docs/k8s.md
# Applied by `make k8s-up`, which first creates the secret and config maps listed below.
#   secret     jwt-private-key  keys/private.pem        (token-issuer)
#   secret     issuer-clients   keys/clients.issuer.json  (token-issuer: hashed client secrets)
#   configmap  kong-config      deploy/kong/kong.yml    (kong)
#   configmap  scoring-config   deploy/scoring.env      (scoring-svc, includes the model pins)
#   configmap  promotion-public-key  promotion-keys/public.pem  (scoring-svc checks promotions)
#   configmap  prometheus-config, grafana-datasources, grafana-providers, grafana-dashboards
#              deploy/prometheus/, deploy/grafana/   (metrics; docs/metrics.md)
#   secret     grafana-admin   (dev password)
#   configmap  postgres-init  deploy/postgres/        (postgres: creates the mlflow database)
#   secret     postgres-credentials, objectstore-credentials, mlflow-credentials,
#              alerts-credentials, model-admin-credentials, cassandra-credentials
#              (dev passwords)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fraud
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - network.yaml
  - redpanda.yaml
  - cassandra.yaml
  - postgres.yaml
  - objectstore.yaml
  - mlflow.yaml
  - alert-svc.yaml
  - model-admin.yaml
  - prometheus.yaml
  - grafana.yaml
  - token-issuer.yaml
  - scoring.yaml
  - ingest.yaml
  - kong.yaml
  - resilience.yaml
