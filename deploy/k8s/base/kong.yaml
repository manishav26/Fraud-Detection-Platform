# The gateway: the only Service reachable from outside the cluster (NodePort 30080, which
# `make cluster` maps to localhost:8080). Same DB-less config and JWT check as compose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
spec:
  replicas: 1
  # A new pod must be ready before an old one goes: rollouts never lower capacity
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: kong}
  template:
    metadata:
      labels: {app: kong}
      annotations:   # Prometheus reads this pod's metrics (deploy/prometheus/)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: kong            # its own identity (docs/network.md)
      automountServiceAccountToken: false   # no Kubernetes API token: it never needs one
      securityContext:
        seccompProfile: {type: RuntimeDefault}   # the runtime's default syscall filter (Trivy KSV-0118)
      containers:
        - name: kong
          image: kong:3.7
          imagePullPolicy: IfNotPresent
          env:
            - {name: KONG_DATABASE, value: "off"}
            - {name: KONG_DECLARATIVE_CONFIG, value: /kong/kong.yml}
            - {name: KONG_PROXY_LISTEN, value: "0.0.0.0:8000"}
            - {name: KONG_ADMIN_LISTEN, value: "off"}   # no admin API inside the cluster
            # Kong reuses idle connections to services for 60 s; our services keep them 75 s
            # (uvicorn --timeout-keep-alive), so Kong always closes first (docs/k8s.md)
            - {name: KONG_UPSTREAM_KEEPALIVE_IDLE_TIMEOUT, value: "60"}
            # Default is one worker per CPU the node has (12 here): over the memory limit
            - {name: KONG_NGINX_WORKER_PROCESSES, value: "2"}
            # Kong's own metrics (latency per route, 401/403/429 counts) on a separate port
            # that isn't exposed outside the cluster
            - {name: KONG_STATUS_LISTEN, value: "0.0.0.0:8100"}
          ports:
            - {name: proxy, containerPort: 8000}
          volumeMounts:
            - {name: config, mountPath: /kong, readOnly: true}
          # Kong's own check, inside the pod: a TCP check on 8000 was answered by the Linkerd proxy,
          # Kong or not (docs/mtls.md, "Probes")
          readinessProbe:
            exec:
              command: ["kong", "health"]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["kong", "health"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            preStop: {sleep: {seconds: 5}}   # finish requests already on their way (docs/k8s.md)
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: config
          configMap: {name: kong-config}
---
apiVersion: v1
kind: Service
metadata:
  name: kong
spec:
  type: NodePort
  selector: {app: kong}
  ports:
    - {name: proxy, port: 8000, nodePort: 30080}
