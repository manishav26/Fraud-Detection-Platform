# Prometheus: reads every service's /metrics every 5 s and keeps 2 days. Inside the cluster only;
# reach it with `make k8s-grafana` (a tunnel). Config: deploy/prometheus/prometheus.k8s.yml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
# Read-only: list pods and nodes to find what to scrape, and read the kubelet's CPU figures.
# A ClusterRole because nodes aren't in a namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fraud-prometheus
rules:
  - apiGroups: [""]
    resources: [pods, nodes, nodes/proxy]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fraud-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fraud-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: fraud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  # A new pod must be ready before an old one goes: rollouts never lower capacity
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
      annotations:
        # Read proxies' metrics directly, not through its own proxy: measuring the mesh must not
        # depend on it (docs/mtls.md)
        config.linkerd.io/skip-outbound-ports: "4191"
    spec:
      serviceAccountName: prometheus
      securityContext:
        seccompProfile: {type: RuntimeDefault}   # the runtime's default syscall filter (Trivy KSV-0118)
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.5
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d   # enough for a test day; keeps memory down
          ports:
            - {name: http, containerPort: 9090}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}   # must not slow down what it measures
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {}   # 2 days of test metrics; lost if the pod restarts
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector: {app: prometheus}
  ports:
    - {name: http, port: 9090}
