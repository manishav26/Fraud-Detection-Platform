_format_version: "3.0"
# One consumer per client in deploy/clients.json, written in by scripts/gen_keys.sh
consumers:
@@CONSUMERS@@
services:
  - name: ingest
    url: http://ingest-svc:8000
    routes:
      - name: score
        paths: ["/v1/transactions"]
        strip_path: false
        plugins:
          - name: jwt
            config: { claims_to_verify: [exp] }
  - name: alerts
    url: http://alert-svc:8000
    routes:
      - name: cases
        paths: ["/cases"]   # list, read and resolve; /stats stays internal
        strip_path: false
        plugins:
          - name: jwt
            config: { claims_to_verify: [exp] }
  - name: token
    url: http://token-issuer:8000
    routes:
      - name: token
        paths: ["/token"]
        strip_path: false
