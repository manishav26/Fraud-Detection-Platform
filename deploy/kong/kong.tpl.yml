_format_version: "3.0"
# Who may call what: the roles table in docs/access.md. On each route, `jwt` checks the token
# and finds the client, then `acl` lets only the listed groups (roles) through; others get 403
# here, before any service sees the request.

# One consumer per client in deploy/clients.json, written in by scripts/gen_keys.sh
consumers:
@@CONSUMERS@@
services:
  - name: ingest
    # ingest's pods directly (a headless Service on Kubernetes, an alias in compose), so Kong
    # balances across them and stops using one that is leaving (docs/k8s.md)
    url: http://ingest-pods:8000
    routes:
      - name: score
        paths: ["/v1/transactions"]
        strip_path: false
        plugins:
          - name: jwt
            config: { claims_to_verify: [exp] }
          # tester: the test-only load-test client, which also gets the full answer (ingest-svc,
          # E6 defense D1). The acl plugin passes the role on in X-Consumer-Groups and replaces
          # any such header the caller sent.
          - name: acl
            config: { allow: [client, tester] }
          # A payment is about 3 KB; anything far bigger is refused (413) before ingest reads it
          - name: request-size-limiting
            config: { allowed_payload_size: 16, size_unit: kilobytes }
  - name: alerts
    url: http://alert-svc:8000
    routes:
      # Two routes, because reading and resolving allow different roles. Any other method or
      # path under /cases matches neither and gets 404. /stats isn't routed at all.
      - name: cases-read
        methods: [GET]
        paths: ["/cases"]
        strip_path: false
        plugins:
          - name: jwt
            config: { claims_to_verify: [exp] }
          - name: acl
            config: { allow: [analyst, admin] }
          - name: rate-limiting
            config: { second: 10, limit_by: consumer, policy: local }
      - name: cases-resolve
        methods: [POST]
        paths: ["~/cases/[0-9]+/resolve$"]
        strip_path: false
        plugins:
          - name: jwt
            config: { claims_to_verify: [exp] }
          - name: acl
            config: { allow: [analyst] }
          - name: rate-limiting
            config: { second: 10, limit_by: consumer, policy: local }
          - name: request-size-limiting
            config: { allowed_payload_size: 4, size_unit: kilobytes }
      # The bank's case-management system (week 4, step 7; docs/siem.md), by transaction id:
      # read a case's status (it and analysts), write back the decision (it alone).
      - name: case-status
        methods: [GET]
        paths: ["~/v1/cases/txn/[^/]+$"]
        strip_path: false
        plugins:
          - name: jwt
            config: { claims_to_verify: [exp] }
          - name: acl
            config: { allow: [case-system, analyst] }
          - name: rate-limiting
            config: { second: 10, limit_by: consumer, policy: local }
      - name: case-decision
        methods: [POST]
        paths: ["~/v1/cases/txn/[^/]+/decision$"]
        strip_path: false
        plugins:
          - name: jwt
            config: { claims_to_verify: [exp] }
          - name: acl
            config: { allow: [case-system] }
          - name: rate-limiting
            config: { second: 10, limit_by: consumer, policy: local }
          - name: request-size-limiting
            config: { allowed_payload_size: 4, size_unit: kilobytes }
  # Changing the live model: admin only (week 4, step 6; docs/mlflow.md). The body is a promotion
  # already signed on the admin's laptop, a few KB at most.
  - name: model-admin
    url: http://model-admin-svc:8000
    routes:
      - name: model
        paths: ["/v1/model"]
        strip_path: false
        plugins:
          - name: jwt
            config: { claims_to_verify: [exp] }
          - name: acl
            config: { allow: [admin] }
          # Admins send a few requests a day; tools send a few back to back (ST2 sends 4 in one
          # second, `make promote` 2). 2/s refused those, so 5/s, with a per-minute cap as well.
          - name: rate-limiting
            config: { second: 5, minute: 60, limit_by: consumer, policy: local }
          - name: request-size-limiting
            config: { allowed_payload_size: 8, size_unit: kilobytes }
  - name: token
    url: http://token-issuer:8000
    routes:
      - name: token
        paths: ["/token"]
        strip_path: false
        plugins:
          # No client is known yet here, so limit by address: slows down guessing secrets.
          # In compose every laptop call shares one address, so this is a shared budget there.
          - name: rate-limiting
            config: { second: 5, limit_by: ip, policy: local }
          - name: request-size-limiting
            config: { allowed_payload_size: 1, size_unit: kilobytes }

# Per-client rate limit on payments (threat 7, test ST7). `local`: counted in Kong's memory,
# which is exact with one Kong; several Kongs would each count separately. Over the limit: 429.
plugins:
  # Kong's metrics for Prometheus, on the status port only (docs/metrics.md)
  - name: prometheus
    config: { status_code_metrics: true, latency_metrics: true }
  - name: rate-limiting
    route: score
    config: { second: 50, limit_by: consumer, policy: local }
  # The test-only load-test client gets more, so replay and load tests can send about 100/s.
  # A rule for a route and a consumer together wins over the route's own rule.
  - name: rate-limiting
    route: score
    consumer: load-test
    config: { second: 500, limit_by: consumer, policy: local }
