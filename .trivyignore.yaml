# Trivy waivers (week 4, step 5; docs/supply-chain.md). Each names the exact files and why. A
# waiver covers only those files: the same finding anywhere else still fails the scan.
misconfigurations:
  - id: KSV-0014   # root file system is not read-only
    paths:
      - deploy/k8s/base/cassandra.yaml
      - deploy/k8s/base/postgres.yaml
      - deploy/k8s/base/redpanda.yaml
      - deploy/k8s/base/objectstore.yaml
      - deploy/k8s/base/kong.yaml
      - deploy/k8s/base/grafana.yaml
      - deploy/k8s/base/prometheus.yaml
      - deploy/k8s/base/mlflow.yaml
      # The same workloads in the VM overlay, as kustomize builds it (scripts/scan.sh config)
      - merged/vm/StatefulSet-cassandra.yaml
      - merged/vm/StatefulSet-postgres.yaml
      - merged/vm/StatefulSet-redpanda.yaml
      - merged/vm/StatefulSet-objectstore.yaml
      - merged/vm/Deployment-kong.yaml
      - merged/vm/Deployment-grafana.yaml
      - merged/vm/Deployment-prometheus.yaml
      - merged/vm/Deployment-mlflow.yaml
    statement: >-
      Third-party images that write their own config and runtime files at start (Cassandra even
      edits its config to turn logins on; Kong and Grafana write under their install folders;
      MLflow keeps state in its home folder). Making each read-only means finding every such path
      per image. Our five services are read-only.
  - id: KSV-0047   # privilege escalation from node proxy
    paths:
      - deploy/k8s/base/prometheus.yaml
      - merged/vm/ClusterRole-fraud-prometheus.yaml   # the same role, in the VM overlay
    statement: >-
      Prometheus reads each node's CPU and memory numbers (cAdvisor) through the API's node proxy:
      a read-only GET on nodes/proxy, the standard way to scrape cAdvisor.

# The feature job's image (week 4, step 1; docs/spark.md, "Supply chain"). The vulnerable
# standalone jars PySpark ships are replaced with fixed releases at build time
# (services/feature-job/patch_jars.sh). These are the copies baked INSIDE Hadoop's and Spark's
# own jars, which only a new Spark release can fix. Each waiver covers that one jar only.
vulnerabilities:
  - id: CVE-2026-102554
    paths:
      - usr/local/lib/python3.11/site-packages/pyspark/jars/hadoop-client-runtime-3.5.0.jar
    statement: >-
      Copies of jackson, guava, jetty and jline shaded inside Hadoop's client, which Spark 4.2.1
      ships. This job uses Hadoop only to write its checkpoint to the local disk: no Hadoop HTTP
      server (jetty) or shell (jline) is started, and the JSON it parses comes only from our own
      topic and checkpoint. Fixed when Spark ships a newer Hadoop.
  - id: CVE-2026-2332
    paths:
